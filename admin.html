<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin - Download Data</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container" style="text-align: center;">
        <h2>🔐 Panel Khusus Admin</h2>
        <p class="subtitle">Unduh rekap database proyek dalam format spreadsheet Excel</p>
        
        <button id="btnDownloadExcel" style="background-color: #15803d;">📥 Download Data Excel</button>
        <button onclick="window.location.href='index.html'" class="btn-link" style="margin-top: 15px;">Kembali ke Beranda</button>
    </div>

    <script>
        document.getElementById('btnDownloadExcel').addEventListener('click', function() {
            let database = JSON.parse(localStorage.getItem('databaseProyekAde')) || [];
            if (database.length === 0) {
                alert("Belum ada data yang tersimpan di dalam database!");
                return;
            }

            let csvContent = "data:text/csv;charset=utf-8,\uFEFF"; // Tambahan BOM agar Excel membaca simbol/huruf Indonesia dengan benar
            csvContent += "Nama Lengkap,Alamat Email,Nomor HP,Waktu Input\n";

            database.forEach(function(row) {
                csvContent += `"${row.namaLengkap}","${row.emailUser}","${row.nomorHp}","${row.waktuInput}"\n`;
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "Laporan_Database_Proyek.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        });
    </script>
</body>
</html>
